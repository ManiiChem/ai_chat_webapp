{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}
    <link  rel="stylesheet" href="{{ url_for('core.static', filename='css/main.css') }}">

    <div class="offcanvas offcanvas-start bg-light" data-bs-scroll="true" tabindex="-1" id="offcanvasChatHistory" aria-labelledby="offcanvasChatHistoryLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold text-secondary" id="offcanvasChatHistoryLabel">
                History
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        
        <div class="offcanvas-body p-0">
            <div class="list-group list-group-flush">
                <!-- Its being handled by our js now -->
            </div>
        </div>
    </div>

    <div class="container">
        <h1 class="text-center mb-4" id="welcomeTitle">Welcome!</h1>

        <div id="chatHistory" class="mb-4 d-flex flex-column gap-3 no-scrollbar" style="max-height: 60vh; overflow-y: auto;">
        </div>

        <div class="position-relative">
            <textarea style="resize: none; height: 10%;" class="form-control rounded-5 shadow-sm text-break overflow-hidden" id="messageArea" required></textarea>
            <button id="submitMessage" type="button" class="btn btn-secondary rounded-circle position-absolute end-0 bottom-0 m-2" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-send-fill" style="font-size: 0.9rem;"></i>
            </button>
        </div>    

    </div>
    <input type="hidden" id="conversationIdField" value="">
    <script src="{{ url_for('core.static', filename='js/messageHandler.js') }}"></script>
{% endblock %}
